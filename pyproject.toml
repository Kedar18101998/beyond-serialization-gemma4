[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ecwg-gemma4-research"
version = "0.1.0"
description = "Evidence-Certified Witness Graphs for offline repository localization research"
authors = [{name = "Keedar Kale"}]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
dependencies = []
keywords = ["code-graph", "software-engineering", "offline", "graph-reasoning", "gemma4", "research"]

[project.scripts]
ecwg = "ecwg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
